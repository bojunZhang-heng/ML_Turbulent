# Run from RETO++/ShapeNet:
#   python main.py --config config_RETO_plus.yml

exp: ShapeNet
model_name: RETO_plus
predicted_feature_name: p_and_v
phase: restart_train

# RETO+ consumes [x, y, z, sdf, normal_x, normal_y, normal_z].
cluster_num: 64
num_position_frequencies: 6
checkpoint_segment_size: 2
# V100 32GB / 600k points: checkpoint the first 6 of 8 blocks. If this still
# OOMs, use 7 and then 8; use a smaller value only when more speed is needed.
checkpoint_num_blocks: 6
layer_scale_init: 0.1

num_epochs: 200
eval_freq: 1
learning_rate: 5.0e-4
pressure_weight: 0.5
batch_size: 1
shuffle: true

# Local test dataset generated by preprocess/process_mlcfd.py.
data_path: /Users/zhangbojun/ML_Turbulent/preprocess/mlcfd_data/pkl_test
vtk_data_path: /Users/zhangbojun/ML_Turbulent/preprocess/mlcfd_data/raw_test
