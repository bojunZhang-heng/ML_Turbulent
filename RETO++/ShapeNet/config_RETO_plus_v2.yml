# ShapeNet-Car: RETO+ v2 with continuous sine/cosine XYZ encoding
experiment:
  exp: ShapeNet_RETO_plus_v2
  model_name: RETO_plus_v2
  # Active task: surface coordinates -> pressure.
  predicted_feature_name: surface_pressure
  # Volume velocity task: predicted_feature_name: volume_velocity
  # Seven-input/four-output task: predicted_feature_name: p_and_v
  phase: restart_train

model:
  # Active surface-pressure task: 3 -> 1.
  space_dim: 3
  out_dim: 1
  # Volume velocity task: space_dim: 3, out_dim: 3
  # Seven-to-four task: space_dim: 7, out_dim: 4
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  act: gelu
  fun_dim: 0
  ref: 8
  time_input: false
  unified_pos: false
  isregular: false
attention:
  n_head: 8
  mlp_ratio: 2
  key_ratio: 1
  cluster_num: 64
  cluster_temperature_init: 1.0
  layer_scale_init: 0.1
position_encoding:
  num_position_frequencies: 6
  sincos_max_wavelength: 10000
checkpoint:
  checkpoint_segment_size: 2
  checkpoint_num_blocks: 6
training:
  num_epochs: 200
  eval_freq: 1
  learning_rate: 1.0e-3
  # Used only by the combined 7 -> 4 task; pressure-only loss is plain MSE.
  pressure_weight: 1.0
  batch_size: 1
  shuffle: true
data:
  # Run from RETO++/ShapeNet. The same v2 PKLs support all three tasks.
  data_path: ../../preprocess/mlcfd_data/pkl_test_v2
  vtk_data_path: ../../preprocess/mlcfd_data/raw_test
  # Remote examples:
  # data_path: /data/zhangbojun/mlcfd_data/pkl_data_v2
  # vtk_data_path: /data/zhangbojun/mlcfd_data/raw_data
