# Run from RETO++/ShapeNet:
#   python main.py --config config_RETO.yml

experiment:
  exp: ShapeNet_RETO
  model_name: RETO
  predicted_feature_name: p_and_v
  phase: restart_train

model:
  space_dim: 7
  out_dim: 4
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  act: gelu
  mlp_ratio: 2

position_encoding:
  sincos_max_wavelength: 10000
  rope_max_wavelength: 10000

training:
  num_epochs: 200
  eval_freq: 1
  learning_rate: 1.0e-3
  pressure_weight: 0.5
  batch_size: 1
  shuffle: true

data:
  data_path: /data/zhangbojun/mlcfd_data/pkl_data
  vtk_data_path: /data/zhangbojun/mlcfd_data/raw_data
