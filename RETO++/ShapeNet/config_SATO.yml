# ShapeNet/MLCFD: seven normalized input features -> [u, v, w, pressure].
# Run from RETO++/ShapeNet:
#   python main.py --config config_SATO.yml

experiment:
  exp: ShapeNet_SATO_combined
  model_name: SATO
  predicted_feature_name: p_and_v
  phase: restart_train

model:
  space_dim: 7
  out_dim: 4
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  act: gelu
  fun_dim: 0

attention:
  n_head: 8
  mlp_ratio: 2
  slice_num: 64

serialization:
  patch_size: 20
  shift: 2
  n_iter: 1

training:
  num_epochs: 200
  eval_freq: 1
  learning_rate: 1.0e-3
  pressure_weight: 0.5
  batch_size: 1
  shuffle: true

data:
  data_path: ../../preprocess/mlcfd_data/pkl_test_v2
  # Remote example:
  # data_path: /data/zhangbojun/mlcfd_data/pkl_data_v2
  vtk_data_path: ../../preprocess/mlcfd_data/raw_test
