# DrivAerStar: surface pressure by default
experiment:
  exp: DrivAerStar_SATO
  model_name: SATO
  predicted_feature_name: surface_pressure
  phase: restart_train
model:
  space_dim: 3
  out_dim: 1
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  act: gelu
  fun_dim: 0
attention:
  n_head: 8
  mlp_ratio: 2
  slice_num: 64
serialization:
  patch_size: 20
  shift: 2
  n_iter: 1
training:
  num_epochs: 200
  eval_freq: 1
  learning_rate: 1.0e-3
  batch_size: 1
  shuffle: true
data:
  dataset_root: /data/zhangbojun/DrivAerStar
  selection_mode: random
  selection_seed: 42
  train_ratio: 0.6
  val_ratio: 0.3
  test_ratio: 0.1
  vehicle_datasets:
    case_E:
      path: case_E_pklFile_10k
      count: all
      enabled: true
    case_F:
      path: case_F_pklFile_10k
      count: all
      enabled: true
    case_N:
      path: case_N_pklFile_10k
      count: all
      enabled: true


