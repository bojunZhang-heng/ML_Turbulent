# DrivAerML: surface pressure by default
experiment:
  exp: DrivAerML_LinearNO_se
  model_name: LinearNO_se
  predicted_feature_name: surface_pressure
  phase: restart_train
model:
  space_dim: 3
  out_dim: 1
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  act: gelu
  fun_dim: 0
  time_input: false
  unified_pos: false
attention:
  n_head: 8
  mlp_ratio: 2
  key_ratio: 1
serialization:
  patch_size: 20
  shift: 2
training:
  num_epochs: 200
  eval_freq: 1
  learning_rate: 1.0e-3
  batch_size: 1
  shuffle: true
data:
  data_path: /Users/zhangbojun/ML_Turbulent/preprocess/drivaerML_N100_000
  selection_mode: random
  selection_seed: 42
  train_ratio: 0.6
  val_ratio: 0.3
  test_ratio: 0.1

