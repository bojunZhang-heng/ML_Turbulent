# Run from RETO++/DrivAerNet:
#   python main.py --config config_Transolver.yml

experiment:
  exp: DrivAerNet_Transolver
  model_name: Transolver
  predicted_feature_name: pressure
  phase: restart_train

model:
  space_dim: 3
  out_dim: 1
  n_layers: 8
  n_hidden: 256
  dropout: 0.0
  act: gelu
  fun_dim: 0
  ref: 8
  unified_pos: false
  isregular: false

attention:
  n_head: 8
  mlp_ratio: 2
  key_ratio: 1
  slice_num: 64

training:
  num_epochs: 200
  eval_freq: 1
  learning_rate: 1.0e-3
  batch_size: 1
  shuffle: true

data:
  # Parent directory containing all vehicle-specific PKL directories.
  dataset_root: /data/zhangbojun/DrivAerNet_dataset/PressureVTK

  # "random" selects a deterministic random subset; "first" selects the
  # lowest numeric PKL IDs. Change the seed to obtain another random subset.
  selection_mode: random
  selection_seed: 42

  # Split independently inside every enabled vehicle type.
  train_ratio: 0.6
  val_ratio: 0.3
  test_ratio: 0.1

  # Each directory may contain 1.pkl, 2.pkl, ... independently. Composite
  # (vehicle, ID) keys prevent collisions between equal numeric filenames.
  vehicle_datasets:
    E_S_WWC_WM:
      #path: E_S_WWC_WMpklFile_10k
      path: E_S_WWC_WMpklFile
      count: 100
      enabled: true
    E_S_WW_WM:
      #path: E_S_WW_WMpklFile_10k
      path: E_S_WW_WMpklFile
      count: 100
      enabled: true
    F_S_WWC_WM:
      #path: F_S_WWC_WMpklFile_10k
      path: F_S_WWC_WMpklFile
      count: 100
      enabled: true
    F_S_WWS_WM:
      #path: F_S_WWS_WMpklFile_10k
      path: F_S_WWS_WMpklFile
      count: 100
      enabled: true
    N_S_WWS_WM:
      #path: N_S_WWS_WMpklFile_10k
      path: N_S_WWS_WMpklFile
      count: 100
      enabled: true
    N_S_WWC_WM:
      #path: N_S_WWC_WMpklFile_10k
      path: N_S_WWC_WMpklFile
      count: 100
      enabled: true
    N_S_WW_WM:
      #path: N_S_WW_WMpklFile_10k
      path: N_S_WW_WMpklFile
      count: 100
      enabled: true
    F_D_WM_WW:
      #path: F_D_WM_WWpklFile_10k
      path: F_D_WM_WWpklFile
      count: 100
      enabled: true
