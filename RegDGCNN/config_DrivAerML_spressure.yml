exp_name: "spressure_N10k_lr1e-3_e250"

model:
    input_dim: 3
    output_dim: 1
    res: true
    emb_dims: 1024
    k: 40
    mlp_ratio: 1.5
    dropout: 0.4
    output_channels: 1

training:
    input: "surface_anchor_position"
    target: "surface_anchor_pressure"
    batch_size: 1
    epochs: 150
    lr: 0.001
    scheduler_step: 50
    scheduler_gamma: 0.5
    max_grad_norm: 0.1
    num_workers: 1
    weight_decay: 0.0001
    test_only: 0
    gpus: "0"
    seed: 42

