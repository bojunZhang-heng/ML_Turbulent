exp_name: "velocity_N10k_lr5e-4_e150"

model:
    input_dim: 3
    output_dim_surface: 1
    output_dim_volume: 3
    geometry_depth: 1
    num_surf_blocks: 6
    num_volume_blocks: 6
    head_num: 8
    hidden_dim: 256
    res: true
    slice_num: 64
    layer_num: 5
    mlp_ratio: 1.5
    dropout: 0.1

training:
    input: "volume_anchor_position"
    target: "volume_anchor_velocity"
    batch_size: 1
    epochs: 150
    lr: 0.0005
    scheduler_step: 150
    scheduler_gamma: 1
    max_grad_norm: 0.1
    num_workers: 1
    weight_decay: 0.00000
    test_only: 0  
    gpus: "0"
    root_dir: "/mnt/wjc_group/mae-zhangbj/DrivAerML_dataset/small"
    seed: 42





    
    

